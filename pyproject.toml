[project]
name = "empty-trips"
version = "0.1.0"
description = "Empty-trip detection and a savings scenario for a truck fleet, on synthetic GPS and cargo-event data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
empty-trips = "empty_trips.cli:main"

[dependency-groups]
dev = [
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]
app = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empty_trips"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a reachable PostgreSQL (PG* environment variables)"]
